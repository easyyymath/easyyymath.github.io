<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyyy_Math — перенесення відповідей</title><style>body{font:16px system-ui;background:#082567;color:white;max-width:760px;margin:50px auto;padding:20px}button{background:#ffde59;color:#082567;border:0;border-radius:12px;padding:14px 20px;font-weight:700;cursor:pointer;margin:6px}button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#061947;padding:20px;border-radius:12px}p{line-height:1.6}</style></head><body><h1>Easyyy_Math ⭐ Перенесення відповідей</h1><p>Цей інструмент <b>не видаляє й не змінює теми або результати учнів</b>. Спочатку перевірка, потім копіювання відповідей у приватну колекцію.</p><button id="login">1. Увійти як адміністратор</button><button id="check" disabled>2. Перевірити без змін</button><button id="copy" disabled>3. Перенести відповіді</button><pre id="out">Спочатку увійди через Google.</pre><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyCzvr1HoHh-v0Eyx_Vi8u5RF7Y1E48PGTE',authDomain:'easyyy-math.firebaseapp.com',projectId:'easyyy-math',appId:'1:977214227394:web:36bbe60178bca4bd3e8c5b'});
const auth=getAuth(app), provider=new GoogleAuthProvider();
const out=document.getElementById('out'), login=document.getElementById('login'),check=document.getElementById('check'),copy=document.getElementById('copy');
let checked=false;
login.onclick=async()=>{try{const r=await signInWithPopup(auth,provider);if(r.user.email!=='sadnesswey@gmail.com'||!r.user.emailVerified)throw Error('Потрібен підтверджений акаунт адміністратора');out.textContent='Увійшла: '+r.user.email+'\nТепер натисни «Перевірити без змін».';check.disabled=false;copy.disabled=true;}catch(e){out.textContent='Помилка входу: '+e.message;}};
async function run(dryRun){check.disabled=true;copy.disabled=true;out.textContent=dryRun?'Перевіряю теми...':'Копіюю відповіді...';try{const token=await auth.currentUser.getIdToken();const res=await fetch('https://neeupndspaqztttpogxy.supabase.co/functions/v1/easyyy-math-api-',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action:'migrate-answer-keys',dryRun})});const data=await res.json();if(!res.ok||!data.success)throw Error(data.error||'HTTP '+res.status);out.textContent=JSON.stringify(data,null,2);if(dryRun){checked=data.summaries.every(x=>['ready','already-migrated'].includes(x.status));copy.disabled=!checked;if(!checked)out.textContent+='\n\nЄ конфлікти або помилки. НЕ перенось відповіді — надішли цей результат.';}else{out.textContent+='\n\nГотово. Нічого з topics не видалено.';}}catch(e){out.textContent='Помилка: '+e.message;}finally{check.disabled=false;if(dryRun&&!checked)copy.disabled=true;}}
check.onclick=()=>run(true);copy.onclick=()=>{if(checked&&confirm('Скопіювати відповіді у answerKeys? Теми не будуть змінені.'))run(false);};
</script></body></html>
