
<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082567">

<title>Easyyy_Math — математика просто та зрозуміло</title>

<meta name="description"
content="Easyyy_Math — навчальна платформа з математики для 5–11 класів. Теорія, квізи, практика, зірочки та нагороди.">

<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<meta property="og:title" content="Easyyy_Math">
<meta property="og:description"
content="Математика, яку ти нарешті зрозумієш!">

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)'],['$','$']],
    displayMath: [['\\[','\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: [
      'script','style','textarea','pre','code'
    ]
  },
  startup: {typeset:false}
};
</script>

<script defer
src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
</script>

<style>
:root {
  --bg:#06194a;
  --bg2:#0a2670;
  --card:#0e2f86;
  --t:#ffffff;
  --m:#b9c6ee;
  --y:#ffde59;
  --r:#ff6b70;
  --g:#3ddc97;
  --bd:#2a4aa8;
}

[data-theme="light"] {
  --bg:#f3f6fd;
  --bg2:#ffffff;
  --card:#ffffff;
  --t:#0b1f4d;
  --m:#5a6b99;
  --bd:#d5ddf0;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--t);
  font-family:system-ui,-apple-system,
    "Segoe UI",sans-serif;
  line-height:1.5;
  overflow-x:hidden;
  background-image:
    radial-gradient(
      circle at 15% -5%,
      #2358d8 0,
      transparent 42%
    ),
    radial-gradient(
      circle at 100% 35%,
      #0f3aa0 0,
      transparent 35%
    );
  background-attachment:fixed;
}

[data-theme="light"] body {
  background-image:
    radial-gradient(
      circle at 15% -5%,
      #dbe6ff 0,
      transparent 45%
    );
}

body.menu-open {
  overflow:hidden;
}

a {
  color:inherit;
}

button,input {
  font:inherit;
}

button {
  cursor:pointer;
}

button:disabled {
  cursor:not-allowed;
  opacity:.55;
}

/* ===== ВЕРХНЯ ПАНЕЛЬ ===== */

header {
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:68px;
  padding:9px 18px;
  background:#0b276c;
  border-bottom:1px solid #294996;
}

.brand {
  display:flex;
  align-items:center;
  gap:9px;
  margin-right:auto;
  color:#ffffff;
  font-size:19px;
  font-weight:800;
  text-decoration:none;
  white-space:nowrap;
}

.brand img {
  width:40px;
  height:40px;
  object-fit:contain;
}

.menu-toggle {
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:43px;
  height:43px;
  border:1px solid #4162ac;
  border-radius:12px;
  background:transparent;
  color:white;
  font-size:24px;
}

.menu-toggle:hover {
  background:#193d90;
}

.header-actions {
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:9px;
  min-width:0;
}

.header-actions #pt {
  white-space:nowrap;
}

.header-actions #au {
  white-space:nowrap;
}

.b {
  display:inline-block;
  padding:10px 16px;
  border:0;
  border-radius:12px;
  background:var(--y);
  color:#0b1f4d;
  font-size:14px;
  font-weight:700;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
  transition:.2s;
}

.b:hover {
  filter:brightness(1.06);
  transform:translateY(-1px);
}

.b.o {
  background:transparent;
  color:var(--t);
  border:2px solid var(--bd);
}

header .b.o {
  color:#ffffff;
  border-color:#3658aa;
}

.pill {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:6px 12px;
  border-radius:16px;
  background:var(--y);
  color:#0b1f4d;
  font-size:13px;
  font-weight:800;
}

.pill:empty {
  display:none;
}

/* ===== БОКОВЕ МЕНЮ ===== */

#nv {
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  z-index:120;

  display:flex;
  flex-direction:column;
  flex-wrap:nowrap;
  flex:none;
  gap:7px;

  width:min(315px,86vw);
  height:100dvh;
  padding:20px 15px;

  overflow-y:auto;
  background:#082567;
  border-right:1px solid #3758a6;
  box-shadow:12px 0 45px #0005;

  transform:translateX(-105%);
  visibility:hidden;

  transition:
    transform .25s ease,
    visibility .25s;
}

#nv.open {
  transform:translateX(0);
  visibility:visible;
}

.side-menu-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:7px 10px 20px;
  color:#ffde59;
  font-size:21px;
}

#closeMenu {
  padding:7px 11px;
  border:1px solid #4565ac;
  border-radius:10px;
  background:#163981;
  color:#ffffff;
  font-size:18px;
}

#nv a {
  display:block;
  width:100%;
  padding:14px 15px;
  border-radius:12px;
  color:#ffffff;
  font-size:16px;
  font-weight:600;
  text-decoration:none;
  transition:.2s;
}

#nv a:hover,
#nv a.on {
  background:#ffde59;
  color:#082567;
}

.side-menu-note {
  margin-top:auto;
  padding:20px 10px;
  border-top:1px solid #3855a0;
  color:#c1d0f5;
  font-size:13px;
  text-align:center;
}

#menuBackdrop {
  display:none;
  position:fixed;
  inset:0;
  z-index:110;
  background:rgba(0,8,34,.68);
}

#menuBackdrop.open {
  display:block;
}

/* ===== ОСНОВНИЙ КОНТЕНТ ===== */

main {
  width:100%;
  max-width:1050px;
  margin:0 auto;
  padding:18px 16px 55px;
  min-height:65vh;
}

footer {
  padding:25px 15px;
  color:var(--m);
  font-size:13px;
  text-align:center;
}

h1,h2,h3 {
  line-height:1.3;
}

.card {
  margin:12px 0;
  padding:18px;
  border:1px solid var(--bd);
  border-radius:16px;
  background:var(--card);
  overflow-wrap:anywhere;
}

.card small {
  color:var(--m);
}

.card a {
  overflow-wrap:anywhere;
}

a.card {
  transition:.2s;
}

a.card:hover {
  transform:translateY(-3px);
  border-color:var(--y);
}

.grid {
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:14px;
}

.big {
  padding:24px;
  border:2px solid var(--y);
  border-radius:18px;
  background:var(--card);
  box-shadow:0 8px 24px #0003;
  font-size:23px;
  font-weight:800;
  text-align:center;
  text-decoration:none;
  transition:.2s;
}

.big:hover {
  transform:translateY(-3px);
}

.big small {
  display:block;
  color:var(--m);
  font-size:13px;
  font-weight:400;
}

/* ===== ГОЛОВНА СТОРІНКА ===== */

.home-hero {
  position:relative;
  overflow:hidden;
  margin:12px 0 30px;
  padding:68px 40px;
  border:1px solid #3656a3;
  border-radius:25px;
  background:
    radial-gradient(
      circle at 90% 15%,
      #2453b9 0,
      transparent 43%
    ),
    linear-gradient(
      135deg,
      #082567,
      #0e3283
    );
  text-align:center;
}

.home-hero::before {
  content:"π";
  position:absolute;
  top:-65px;
  right:5%;
  color:rgba(255,255,255,.045);
  font-size:270px;
  font-weight:800;
  pointer-events:none;
}

.hero-eyebrow {
  position:relative;
  display:inline-block;
  padding:8px 16px;
  border:1px solid #597ac4;
  border-radius:30px;
  background:#ffffff10;
  color:#ffde59;
  font-size:13px;
  font-weight:700;
}

.home-hero h1 {
  position:relative;
  max-width:800px;
  margin:24px auto;
  color:#ffffff;
  font-size:clamp(32px,5vw,58px);
  line-height:1.12;
  letter-spacing:-1.5px;
}

.home-hero h1 span {
  color:#ffde59;
}

.home-hero p {
  position:relative;
  max-width:620px;
  margin:0 auto 28px;
  color:#d7e4ff;
  font-size:17px;
}

.hero-actions {
  position:relative;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
}

.hero-actions .b {
  padding:13px 23px;
}

.hero-actions .b.o {
  color:#ffffff;
  border-color:#6688d4;
}

.home-section-title {
  margin:30px 0 16px;
  font-size:26px;
}

.home-subjects {
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:15px;
}

.home-subject {
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:28px 23px;
  border:1px solid var(--bd);
  border-radius:19px;
  background:var(--card);
  text-decoration:none;
  transition:.2s;
}

.home-subject:hover {
  transform:translateY(-3px);
  border-color:var(--y);
}

.subject-icon {
  font-size:34px;
}

.home-subject strong {
  font-size:24px;
}

.home-subject small {
  color:var(--m);
  font-size:14px;
}

.subject-link {
  margin-top:10px;
  color:var(--y);
  font-weight:700;
}

.home-features {
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:14px;
  margin:20px 0;
}

.home-feature {
  padding:22px;
  border:1px solid var(--bd);
  border-radius:18px;
  background:var(--card);
}

.feature-icon {
  font-size:30px;
}

.home-feature h3 {
  margin:12px 0 8px;
  font-size:18px;
}

.home-feature p {
  margin:0;
  color:var(--m);
  font-size:14px;
}

.home-bottom {
  margin:30px 0;
  padding:30px 25px;
  border:1px solid var(--bd);
  border-radius:20px;
  background:var(--card);
  text-align:center;
}

.home-bottom h2 {
  margin-top:0;
}

.home-bottom p {
  color:var(--m);
}

/* ===== ВКЛАДКИ ===== */

.tabs {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:14px 0;
}

.tabs a,
.tabs button {
  padding:8px 14px;
  border:2px solid var(--bd);
  border-radius:16px;
  background:transparent;
  color:var(--t);
  font:inherit;
  text-decoration:none;
  cursor:pointer;
}

.tabs .on {
  background:var(--y);
  border-color:var(--y);
  color:#0b1f4d;
}

/* ===== МАТЕМАТИКА ===== */

.f {
  margin:10px 0;
  padding:14px 16px;
  border-radius:12px;
  background:var(--y);
  color:#0b1f4d;
  font-weight:700;
  overflow-wrap:anywhere;
}

.tip {
  margin:10px 0;
  padding:12px 15px;
  border-left:5px solid var(--y);
  border-radius:10px;
  background:#fff3bd;
  color:#4a3b00;
}

.err {
  margin:10px 0;
  padding:12px 15px;
  border-left:5px solid var(--r);
  border-radius:10px;
  background:#ffe0e1;
  color:#6b0f13;
}

.MathJax,
mjx-container {
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
}

figure {
  margin:14px 0;
}

figure img {
  display:block;
  max-width:100%;
  height:auto;
  border-radius:12px;
  background:#ffffff;
}

figcaption {
  margin-top:5px;
  color:var(--m);
  font-size:13px;
}

/* ===== КВІЗИ ===== */

.q button {
  display:block;
  width:100%;
  margin:7px 0;
  padding:12px 14px;
  border:2px solid var(--bd);
  border-radius:11px;
  background:transparent;
  color:var(--t);
  font:inherit;
  text-align:left;
  cursor:pointer;
  transition:.15s;
}

.q button:not(:disabled):hover {
  border-color:var(--y);
}

.q button.ok {
  background:var(--g);
  border-color:var(--g);
  color:#032;
}

.q button.bad {
  background:var(--r);
  border-color:var(--r);
  color:#300;
}

/* ===== ПРАКТИКА ===== */

input {
  width:100%;
  padding:12px;
  border:2px solid var(--bd);
  border-radius:11px;
  background:var(--bg2);
  color:var(--t);
}

input[type="checkbox"] {
  width:auto;
}

.answer-row {
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:14px;
}

.answer-row input {
  flex:1;
  min-width:150px;
}

.feedback {
  font-weight:650;
}

.feedback.good {
  color:var(--g);
}

.feedback.bad {
  color:var(--r);
}

details {
  margin-top:12px;
}

summary {
  cursor:pointer;
  font-weight:600;
}

/* ===== КАБІНЕТ ===== */

.stat-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:11px;
}

.stat {
  padding:17px 8px;
  text-align:center;
}

.stat strong {
  display:block;
  color:var(--y);
  font-size:28px;
}

.stat span {
  color:var(--m);
  font-size:12px;
}

.progress-line {
  height:10px;
  margin:10px 0;
  overflow:hidden;
  border-radius:20px;
  background:var(--bg);
}

.progress-line span {
  display:block;
  height:100%;
  border-radius:20px;
  background:var(--y);
}

.topic-status {
  color:var(--m);
  font-size:13px;
}

.empty {
  padding:20px;
  color:var(--m);
  text-align:center;
}

/* ===== МАГАЗИН ===== */

.shop-grid {
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:14px;
}

.shop-card {
  display:flex;
  flex-direction:column;
  gap:9px;
  padding:19px;
  transition:.2s;
}

.shop-card:hover {
  transform:translateY(-3px);
  border-color:var(--y);
}

.shop-card h3 {
  margin:0;
}

.shop-card p {
  flex:1;
  color:var(--m);
}

.shop-price {
  color:var(--y);
  font-size:23px;
  font-weight:800;
}

.shop-card .b {
  text-align:center;
}

.shop-section {
  margin:26px 0;
}

.shop-icon {
  font-size:38px;
}

.shop-balance {
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:13px;
}

.shop-balance strong {
  color:var(--y);
  font-size:27px;
}

/* ===== ФОРМА ЗАПИСУ ===== */

iframe {
  width:100%;
  height:700px;
  border:0;
  border-radius:15px;
  background:white;
}

/* ===== ПЛАНШЕТИ ===== */

@media(max-width:900px) {
  .home-hero {
    padding:50px 25px;
  }

  .home-features {
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .shop-grid {
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }
}

/* ===== ТЕЛЕФОНИ ===== */

@media(max-width:700px) {
  header {
    min-height:62px;
    padding:8px 10px;
    gap:7px;
  }

  .menu-toggle {
    width:37px;
    height:37px;
    font-size:21px;
  }

  .brand {
    gap:5px;
    font-size:14px;
  }

  .brand img {
    width:30px;
    height:30px;
  }

  .header-actions {
    gap:5px;
  }

  .header-actions #pt {
    padding:5px 7px;
    font-size:11px;
  }

  .header-actions #th {
    padding:6px 8px;
    font-size:13px;
  }

  .header-actions #au {
    max-width:94px;
    padding:7px 8px;
    overflow:hidden;
    font-size:11px;
    text-overflow:ellipsis;
  }

  #nv {
    width:min(300px,85vw);
  }

  main {
    padding:12px 12px 40px;
  }

  .home-hero {
    margin-top:5px;
    padding:42px 19px;
    border-radius:19px;
  }

  .home-hero h1 {
    font-size:clamp(29px,8vw,42px);
    letter-spacing:-1px;
  }

  .home-hero p {
    font-size:14px;
  }

  .hero-actions {
    flex-direction:column;
  }

  .hero-actions .b {
    width:100%;
  }

  .home-subjects,
  .home-features,
  .shop-grid,
  .grid {
    grid-template-columns:1fr;
  }

  .home-subject {
    padding:21px;
  }

  .home-feature {
    padding:18px;
  }

  .home-section-title {
    font-size:22px;
  }

  .home-bottom {
    padding:21px 16px;
  }

  .tabs {
    gap:5px;
  }

  .tabs a,
  .tabs button {
    padding:7px 10px;
    font-size:13px;
  }

  .stat-grid {
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .q button {
    min-height:46px;
  }

  .card {
    padding:15px;
  }

  .answer-row {
    flex-direction:column;
  }

  .answer-row input {
    width:100%;
  }

  iframe {
    height:75vh;
  }
}

/* ===== МАЛЕНЬКІ ТЕЛЕФОНИ ===== */

@media(max-width:380px) {
  .brand {
    font-size:12px;
  }

  .brand img {
    width:25px;
    height:25px;
  }

  .header-actions #au {
    max-width:75px;
    font-size:10px;
  }

  .home-hero h1 {
    font-size:28px;
  }
}

/* Вхід у меню; старий вигляд сторінки збережено */
#au[hidden]{display:none!important}
#nv .menu-auth{display:block;width:100%;text-align:left;padding:14px 15px;border:1px solid #4565ac;border-radius:12px;background:#163981;color:white;font:600 16px system-ui,sans-serif;cursor:pointer;margin-top:8px}
#nv .menu-auth:hover{background:#ffde59;color:#082567}
.menu-toggle{font-size:25px;line-height:1;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
@media(max-width:480px){.header-actions{gap:6px}.header-actions #th{padding:8px 10px}}
</style>
</head>

<body>

<!-- ===== ШАПКА САЙТУ ===== -->

<header>
  <button
    class="menu-toggle"
    id="mn"
    type="button"
    aria-label="Відкрити меню"
    aria-expanded="false"
    aria-controls="nv"
  >☰</button>

  <a class="brand" href="#home">
    <img id="lg" src="logo-white.png" alt="">
    Easyyy_Math
  </a>

  <nav id="nv" aria-label="Основна навігація">
    <div class="side-menu-heading">
      <strong>Навігація</strong>

      <button
        id="closeMenu"
        type="button"
        aria-label="Закрити меню"
      >✕</button>
    </div>

    <a href="#home">🏠 Головна</a>
    <a href="#account">👤 Мій кабінет</a>
    <a href="#shop">🛍️ Магазин ⭐</a>
    <a href="#leaderboard">🏆 Рейтинг</a>
    <a href="#about">🎓 Твій наставник</a>
    <a href="#book">📅 Запис на заняття</a>

    <button type="button" id="menuAuth" class="menu-auth">🔐 Увійти через Google</button>

    <div class="side-menu-note">
      Математику не зубрять — її розуміють 💙
    </div>
  </nav>

  <div id="menuBackdrop"></div>

  <div class="header-actions">
    <span class="pill" id="pt"></span>

    <button
      class="b o"
      id="th"
      aria-label="Змінити тему"
    >🌓</button>

    <button class="b" id="au" hidden>
      Увійти через Google
    </button>
  </div>
</header>

<main id="app"></main>

<footer>
  © Easyyy_Math · математику не зубрять — її розуміють
</footer>

<script type="module">

/* ===== ДОПОМІЖНІ ФУНКЦІЇ ===== */

function esc(s) {
  return String(s==null?'':s)
    .replace(/[&<>"']/g,c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c]));
}

function safeLink(url) {
  try {
    const u=new URL(url,location.href);

    return ['http:','https:'].includes(u.protocol)
      ?u.href
      :'#';
  }catch {
    return '#';
  }
}

function rich(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}

function formulaMarkup(value) {
  const source=String(value??'').trim();

  if(!source)return '';

  const content=rich(source);

  const wrapped=/\\\(|\\\[|(^|[^\\])\$/.test(source);

  return wrapped
    ?content
    :`\\[${content}\\]`;
}

function typesetMath(root=app) {
  const mj=window.MathJax;

  if(!mj?.startup?.promise)return;

  mj.startup.promise.then(()=>{
    if(!root?.isConnected)return;

    mj.typesetClear([root]);

    return mj.typesetPromise([root]);
  }).catch(console.error);
}

/* ===== ЗІРОЧКИ ТА ПРОГРЕС ===== */

const points=()=>Object.keys(prog).reduce(
  (sum,k)=>
    sum+(
      prog[k]&&/:q\d+$/.test(k)
        ?10
        :prog[k]&&/:p\d+$/.test(k)
          ?5
          :0
    ),
  0
);

function updatePoints() {
  $('#pt').textContent=user
    ?'⭐ '+points()
    :'';
}

async function saveProgress(key) {
  if(prog[key])return;

  prog[key]=1;
  updatePoints();

  if(user&&LIVE&&db) {
    try {
      await fs.setDoc(
        fs.doc(db,'users',user.uid),
        {
          progress:prog,
          last:Date.now()
        },
        {merge:true}
      );
    }catch(e) {
      console.error(
        'Помилка збереження:',
        e
      );
    }
  }
}

/* ===== КВІЗИ ===== */

function setupQuiz(t,id) {
  const quiz=t.quiz||[];

  const boxes=[
    ...app.querySelectorAll('.q')
  ];

  let right=0;
  let answered=0;
  let finished=false;

  boxes.forEach(box=>{
    const i=Number(box.dataset.i);
    const q=quiz[i];

    box.querySelectorAll('button')
      .forEach(button=>{
        button.onclick=()=>{
          if(button.disabled||finished)return;

          const chosen=Number(
            button.dataset.j
          );

          const correct=Number(
            q.a??q.correct??0
          );

          box.querySelectorAll('button')
            .forEach((b,j)=>{
              b.disabled=true;

              if(j===correct) {
                b.classList.add('ok');
              }
            });

          if(chosen===correct) {
            right++;
            saveProgress(id+':q'+i);
          }else {
            button.classList.add('bad');
          }

          answered++;

          if(
            answered===quiz.length &&
            !finished
          ) {
            finished=true;

            saveProgress(id+':done');

            app.insertAdjacentHTML(
              'beforeend',
              `
                <div class="card">
                  <h3>
                    Результат:
                    ${right} / ${quiz.length}
                  </h3>

                  <p>
                    ${
                      right===quiz.length
                        ?'Чудова робота! Усі відповіді правильні 🎉'
                        :'Гарна спроба! Переглянь помилки та повтори тему.'
                    }
                  </p>

                  ${
                    user
                      ?'<small>Прогрес збережено в кабінеті.</small>'
                      :'<small>Увійди через Google, щоб зберігати прогрес.</small>'
                  }
                </div>
              `
            );
          }
        };
      });
  });
}

/* ===== ПЕРЕВІРКА ПРАКТИКИ ===== */

function normalizeAnswer(value) {
  return String(value??'')
    .trim()
    .toLowerCase()
    .replace(/−/g,'-')
    .replace(/,/g,'.')
    .replace(/\s+/g,'')
    .replace(/°$/,'');
}

function checkAnswer(value,expected) {
  const a=normalizeAnswer(value);

  if(!a)return false;

  return String(expected??'')
    .split(';')
    .some(option=>{
      const b=normalizeAnswer(option);

      if(a===b)return true;

      const x=Number(a);
      const y=Number(b);

      return a!=='' &&
        b!=='' &&
        Number.isFinite(x) &&
        Number.isFinite(y) &&
        Math.abs(x-y)<1e-9;
    });
}

function setupPractice(t,id) {
  app.querySelectorAll('[data-check]')
    .forEach(button=>{
      button.onclick=async()=>{
        const i=Number(
          button.dataset.check
        );

        const p=t.practice[i];

        const input=app.querySelector(
          `[data-answer="${i}"]`
        );

        const feedback=app.querySelector(
          `[data-feedback="${i}"]`
        );

        const value=input.value.trim();
        const expected=p.a||p.answer||'';

        if(!value) {
          feedback.textContent=
            'Спочатку введи відповідь.';
          return;
        }

        if(!expected) {
          feedback.textContent=
            'Правильну відповідь ще не додано.';
          return;
        }

        if(checkAnswer(value,expected)) {
          feedback.textContent=
            'Правильно! +5 ⭐';

          feedback.className=
            'feedback good';

          input.disabled=true;
          button.disabled=true;
          button.textContent='✓ Виконано';

          if(!prog[id+':p'+i]) {
            await saveProgress(
              id+':p'+i
            );
          }
        }else {
          feedback.textContent=
            'Поки неправильно. Спробуй ще раз 💙';

          feedback.className=
            'feedback bad';
        }
      };
    });
}

/* ===== ОСОБИСТИЙ КАБІНЕТ ===== */

function accountPage() {
  if(!user) {
    app.innerHTML=`
      <h2>👤 Мій кабінет</h2>

      <div class="card">
        <p>
          Увійди через Google, щоб переглядати
          власний прогрес і зберігати результати.
        </p>

        <button
          class="b"
          id="accountLogin"
        >
          Увійти через Google
        </button>
      </div>
    `;

    $('#accountLogin').onclick=
      ()=>$('#au').click();

    return;
  }

  const completed=topics.filter(
    t=>prog[t.id+':done']
  );

  const quizAnswers=Object.keys(prog)
    .filter(k=>/:q\d+$/.test(k))
    .length;

  const practiceDone=Object.keys(prog)
    .filter(k=>/:p\d+$/.test(k))
    .length;

  const totalTopics=topics.length;

  const percent=totalTopics
    ?Math.round(
      completed.length/totalTopics*100
    )
    :0;

  app.innerHTML=`
    <h2>👤 Мій кабінет</h2>

    <div class="card">
      <h3>
        Привіт,
        ${esc(user.displayName||'учню')}! 💛
      </h3>

      <p class="topic-status">
        ${esc(user.email||'')}
      </p>

      <p>
        Тут зберігається твій навчальний прогрес.
      </p>
    </div>

    <div class="stat-grid">
      <div class="card stat">
        <strong>${quizAnswers}</strong>
        <span>Правильних відповідей</span>
      </div>

      <div class="card stat">
        <strong>${practiceDone}</strong>
        <span>Виконаних завдань</span>
      </div>

      <div class="card stat">
        <strong>${completed.length}</strong>
        <span>Пройдених квізів</span>
      </div>
    </div>

    <div class="card">
      <div style="
        display:flex;
        justify-content:space-between;
        gap:10px;
      ">
        <b>Загальний прогрес</b>
        <b>${percent}%</b>
      </div>

      <div class="progress-line">
        <span style="width:${percent}%"></span>
      </div>

      <small>
        Пройдено тем:
        ${completed.length} із ${totalTopics}
      </small>
    </div>

    <div class="card">
      <h3>⭐ Мої зірочки: ${points()}</h3>

      <p>
        За правильну відповідь у квізі —
        10 зірочок, за виконане практичне
        завдання — 5.
      </p>

      <a class="b" href="#shop">
        🎒 Магазин та інвентар
      </a>
    </div>

    <h3>📚 Мої результати за темами</h3>

    <div id="myTopics"></div>
  `;

  const target=$('#myTopics');

  if(!topics.length) {
    target.innerHTML=`
      <div class="card empty">
        Навчальні теми поки не додані.
      </div>
    `;
    return;
  }

  target.innerHTML=topics.map(t=>{
    const quizCount=(t.quiz||[]).length;
    const practiceCount=(t.practice||[]).length;

    const correct=(t.quiz||[])
      .filter((q,i)=>
        !!prog[t.id+':q'+i]
      ).length;

    const practice=(t.practice||[])
      .filter((p,i)=>
        !!prog[t.id+':p'+i]
      ).length;

    const done=!!prog[t.id+':done'];

    return `
      <div class="card">
        <div style="
          display:flex;
          justify-content:space-between;
          gap:10px;
          flex-wrap:wrap;
        ">
          <b>${esc(t.title)}</b>

          <span class="topic-status">
            ${
              done
                ?'✓ Квіз завершено'
                :'У процесі'
            }
          </span>
        </div>

        <small>
          ${t.grade} клас ·
          ${NAMES[t.subject]||esc(t.subject)}
        </small>

        <p class="topic-status">
          Правильних відповідей:
          ${correct}/${quizCount}<br>

          Практичних завдань:
          ${practice}/${practiceCount}
        </p>

        <a
          class="b o"
          href="#topic/${encodeURIComponent(t.id)}"
        >
          Перейти до теми
        </a>
      </div>
    `;
  }).join('');
}

/* ===== ТВІЙ НАСТАВНИК ===== */

function aboutPage() {

      <a

        rel="noopener noreferrer"

      >
        ${esc(s.name)}
      </a>
    `).join('');

  const cases=(S.cases||[])
    .map(c=>`
      <div class="card">
        <h3>
          ${esc(c.title||'Результат учня')}
        </h3>

        ${
          (c.grade||c.subject)
            ?`<small>
                ${esc(
                  [c.grade,c.subject]
                    .filter(Boolean)

        ${
          c.description

                ${rich(c.description)}

            ?`<div class="tip">

  const reviews=(S.reviews||[])
    .map(r=>`
      <div class="card">
        <p>
          «${rich(r.text||'')}»
        </p>

        <b>
          ${esc(r.name||'Відгук')}

        ${
          r.detail
            ?`<br>
               <small>
                 ${esc(r.detail)}
               </small>`
            :''
        }
      </div>
    `).join('');

  app.innerHTML=`
    <h2>🎓 Твій наставник</h2>

    <div class="card">
      <p>${rich(S.about||'')}</p>

      <div class="hero-actions">
        ${socials}
      </div>
    </div>

    ${
      cases
        ?'<h2>Результати учнів</h2>'+cases
        :''
    }

    ${
      reviews
        ?'<h2>Відгуки</h2>'+reviews
        :''
    }

    <a class="b" href="#book">
      Записатися на заняття
    </a>
  `;
}

/* ===== БОКОВЕ МЕНЮ ===== */

const menu=$('#nv');
const menuButton=$('#mn');
const menuBackdrop=$('#menuBackdrop');
const closeMenuButton=$('#closeMenu');

function openSideMenu() {
  menu.classList.add('open');
  menuBackdrop.classList.add('open');

  document.body.classList.add('menu-open');

  menuButton.setAttribute(
    'aria-expanded',
    'true'
  );

  menuButton.setAttribute(
    'aria-label',
    'Закрити меню'
  );
}

function closeSideMenu() {
  menu.classList.remove('open');
  menuBackdrop.classList.remove('open');

  document.body.classList.remove('menu-open');

  menuButton.setAttribute(
    'aria-expanded',
    'false'
  );

  menuButton.setAttribute(
    'aria-label',
    'Відкрити меню'
  );
}

menuButton.onclick=()=>{
  if(menu.classList.contains('open')) {
    closeSideMenu();
  }else {
    openSideMenu();
  }
};

$('#menuAuth').onclick=()=>{closeSideMenu();$('#au').click();};

closeMenuButton.onclick=closeSideMenu;
menuBackdrop.onclick=closeSideMenu;

menu.querySelectorAll('a').forEach(link=>{
  link.addEventListener(
    'click',
    closeSideMenu
  );
});

document.addEventListener('keydown',event=>{
  if(event.key==='Escape') {
    closeSideMenu();
  }
});

/* ===== НАВІГАЦІЯ САЙТУ ===== */

function route() {
  const parts=location.hash.slice(1).split('/');

  const routeName=parts[0]||'home';

  const a=parts[1]
    ?decodeURIComponent(parts[1])
    :'';

  const b=parts[2]
    ?decodeURIComponent(parts[2])
    :'';

  closeSideMenu();

  document.querySelectorAll('#nv a')
    .forEach(link=>{
      link.classList.toggle(
        'on',
        link.getAttribute('href')===
          '#'+routeName
      );
    });

  const routes={
    home:home,

    subj:()=>subjectPage(a,b),

    topic:()=>topicPage(
      a,
      b||'theory'
    ),

    account:accountPage,

    shop:shopPage,

    leaderboard:()=>{
      app.innerHTML=`
        <div class="card">
          Завантаження рейтингу...
        </div>
      `;
    },

    materials:()=>{
      location.hash='#shop';
    },

    about:aboutPage,

    book:bookPage
  };

  (routes[routeName]||home)();

  window.scrollTo(0,0);

  typesetMath(app);
}

/* ===== ЗАПУСК ===== */

addEventListener('hashchange',route);

window.addEventListener('load',()=>{
  typesetMath(app);
});

route();

</script>
