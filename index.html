<!-- MathJax 3: професійне відображення математичних формул -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)'], ['$', '$']],
    displayMath: [['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  },
  startup: { typeset: false }
};
</script>

<style>
:root{
 --bg:#06194a;--bg2:#0a2670;--card:#0e2f86;
 --t:#fff;--m:#b9c6ee;--y:#ffd23f;
 --r:#ff6b70;--g:#3ddc97;--bd:#2a4aa8;
}
[data-theme=light]{
 --bg:#f3f6fd;--bg2:#fff;--card:#fff;
 --t:#0b1f4d;--m:#5a6b99;--bd:#d5ddf0;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--t);
 font-family:system-ui,-apple-system,Segoe UI,sans-serif;
 line-height:1.5;overflow-x:hidden;
 background-image:
 radial-gradient(circle at 15% -5%,#2358d8 0,transparent 42%),
 radial-gradient(circle at 100% 35%,#0f3aa0 0,transparent 35%);
 background-attachment:fixed;
}
[data-theme=light] body{
 background-image:radial-gradient(circle at 15% -5%,#dbe6ff 0,transparent 45%);
}
a{color:inherit}
button,input{font:inherit}
header{
 position:sticky;top:0;z-index:5;background:var(--bg2);
 border-bottom:1px solid var(--bd);display:flex;

}
.brand{

}
.brand img{width:38px;height:38px;object-fit:contain}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}

}
nav a:hover,nav a.on{background:var(--y);color:#0b1f4d}
#mn{display:none;order:5}

}
.b.o{background:none;color:var(--t);border:2px solid var(--bd)}
.b:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:700px){

 #mn{display:inline-block}
 nav{display:none;flex:none;width:100%;order:9;flex-direction:column;gap:2px}

}
main{max-width:900px;margin:0 auto;padding:16px 14px 50px}
.hero{width:100vw;margin:-16px 0 0 calc(50% - 50vw)}
.hero img{
 width:100%;max-height:70vh;object-fit:cover;
 object-position:center;display:block;

.cta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.big{
 background:var(--card);border:2px solid var(--y);

}
.big small{display:block;font-weight:400;font-size:13px;color:var(--m)}
.card{

}
.card small{color:var(--m)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs a,.tabs button{

 background:none;color:var(--t);text-decoration:none;
 font:inherit;cursor:pointer;
}
.tabs .on{background:var(--y);color:#0b1f4d;border-color:var(--y)}
.f{
 background:var(--y);color:#0b1f4d;padding:10px 14px;
 border-radius:10px;font-weight:700;margin:8px 0;
 overflow-wrap:anywhere;
}
.tip{
 background:#fff3bd;color:#4a3b00;border-left:5px solid var(--y);
 padding:10px 12px;border-radius:8px;margin:8px 0;
}
.err{
 background:#ffe0e1;color:#6b0f13;border-left:5px solid var(--r);
 padding:10px 12px;border-radius:8px;margin:8px 0;
}
.q button{
 display:block;width:100%;text-align:left;margin:5px 0;
 padding:10px 12px;border:2px solid var(--bd);
 border-radius:10px;background:none;color:var(--t);
 font:inherit;cursor:pointer;
}
.q button.ok{background:var(--g);color:#032;border-color:var(--g)}
.q button.bad{background:var(--r);color:#300;border-color:var(--r)}
input{
 width:100%;padding:11px;border:2px solid var(--bd);
 border-radius:10px;background:var(--bg2);color:var(--t);
}
input[type=checkbox]{width:auto}
iframe{width:100%;height:700px;border:0;border-radius:14px;background:#fff}
footer{text-align:center;color:var(--m);font-size:13px;padding:20px}
figure{margin:12px 0}
figure img{max-width:100%;border-radius:12px;background:#fff;display:block}
figcaption{color:var(--m);font-size:13px;margin-top:4px}
.pill{
 background:var(--y);color:#0b1f4d;border-radius:14px;
 padding:5px 11px;font-weight:700;font-size:13px;
}
.pill:empty{display:none}
.MathJax{max-width:100%;overflow-x:auto;overflow-y:hidden}
.f .MathJax{font-size:1.08em}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;padding:15px 8px}
.stat strong{display:block;color:var(--y);font-size:27px}
.stat span{font-size:12px;color:var(--m)}
.progress-line{
 height:9px;background:var(--bg);border-radius:20px;
 overflow:hidden;margin:8px 0;
}
.progress-line span{

 border-radius:20px;
}
.topic-status{font-size:12px;color:var(--m)}

a.card:hover,.big:hover{transform:translateY(-3px);border-color:var(--y)}

<script type="module">
import {firebaseConfig} from './firebase-config.js';

const LIVE=!!firebaseConfig?.apiKey &&
 !firebaseConfig.apiKey.startsWith('YOUR');

let topics=[
 {
  id:'g1',subject:'geometry',grade:7,section:'Трикутники',
  title:'Сума кутів трикутника',
  theory:'Сума кутів будь-якого трикутника дорівнює 180°.',
  formula:'∠A + ∠B + ∠C = 180°',
  tip:'Три кути складаються в розгорнутий кут.',
  mistake:'У чотирикутнику сума кутів 360°, а не 180°.',
  quiz:[{q:'Кути 50° і 60°. Чому дорівнює третій кут?',
   o:['60°','70°','80°'],a:1}],
  practice:[{q:'У трикутнику два кути по 45°. Знайди третій.',
   a:'90°'}]
 },
 {
  id:'a1',subject:'algebra',grade:7,section:'Вирази',
  title:'Формула різниці квадратів',
  theory:'Різниця квадратів розкладається на добуток суми й різниці.',
  formula:'a² − b² = (a − b)(a + b)',
  tip:'«Квадрат мінус квадрат — дужка на дужку».',
  mistake:'(a − b)² ≠ a² − b².',
  quiz:[{q:'x² − 9 = ?',o:['(x − 3)²','(x − 3)(x + 3)','(x − 9)(x + 1)'],a:1}],
  practice:[{q:'Розклади 25 − y².',a:'(5 − y)(5 + y)'}]
 }
];

let S={
 about:'Привіт! Я Саша — твій матнаставник. Допомагаю зрозуміти математику, а не зубрити її.',
 formUrl:'',
 socials:[{name:'Telegram',url:'https://t.me/easyyy_math'}]
};

let user=null;
let prog={};
let db,fs,auth,au;
let authReady=false;

const $=s=>document.querySelector(s);
const app=$('#app');
const NAMES={algebra:'Алгебра',geometry:'Геометрія'};
const GRADES=[5,6,7,8,9,10,11];

function esc(s){
 return String(s==null?'':s).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function safeLink(url){
 try{
  const u=new URL(url,location.href);
  return ['http:','https:'].includes(u.protocol)?u.href:'#';
 }catch{return '#'}
}

function rich(s){
 return esc(s)
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\n/g,'<br>');
}

// Якщо формула введена без delimiters, автоматично робимо її display-формулою.
function formulaMarkup(value){
 const source=String(value==null?'':value).trim();
 if(!source)return '';
 const content=rich(source);
 const alreadyWrapped=/\\\(|\\\[|(^|[^\\])\$/.test(source);
 return alreadyWrapped?content:`\\[${content}\\]`;
}

// Повторно запускаємо MathJax після кожного перемальовування сторінки.
function typesetMath(root=app){
 const mj=window.MathJax;
 if(!mj || !mj.startup || !mj.startup.promise)return;
 mj.startup.promise.then(()=>{
  if(!root || !root.isConnected)return;
  mj.typesetClear([root]);
  return mj.typesetPromise([root]);
 }).catch(error=>console.error('MathJax error:',error));
}

function notifyError(message){
 app.insertAdjacentHTML('afterbegin',
  `<div class="card">${esc(message)}</div>`);
}

if(LIVE){
 const version='10.12.2/';
 const base='https://www.gstatic.com/firebasejs/'+version;

 const [A,Au,F]=await Promise.all([
  import(base+'firebase-app.js'),
  import(base+'firebase-auth.js'),
  import(base+'firebase-firestore.js')
 ]);

 const firebaseApp=A.initializeApp(firebaseConfig);
 auth=Au.getAuth(firebaseApp);
 au=Au;
 db=F.getFirestore(firebaseApp);
 fs=F;

 try{
  const t=await fs.getDocs(fs.collection(db,'topics'));
  if(!t.empty)topics=t.docs.map(d=>({id:d.id,...d.data()}));

  const s=await fs.getDoc(fs.doc(db,'settings','site'));
  if(s.exists())S={...S,...s.data()};
 }catch(e){
  console.error('Помилка завантаження матеріалів:',e);
 }

 au.onAuthStateChanged(auth,async u=>{
  user=u;
  prog={};

  if(u){
   try{
    const d=await fs.getDoc(fs.doc(db,'users',u.uid));
    prog=(d.data()||{}).progress||{};

    await fs.setDoc(fs.doc(db,'users',u.uid),{
     name:u.displayName||'Учень',
     email:u.email||'',
     last:Date.now()
    },{merge:true});
   }catch(e){
    console.error('Не вдалося завантажити прогрес:',e);
   }
  }

  authReady=true;
  updateAuthButton();
  updatePoints();
  route();
 });
}else{
 authReady=true;
}

function updateAuthButton(){
 $('#au').textContent=user
  ?'Вийти ('+(user.displayName||'').split(' ')[0]+')'
  :'Увійти через Google';
}

$('#au').onclick=async()=>{
 if(!LIVE){
  alert('Потрібно підключити Firebase.');
  return;
 }
 try{
  if(user)await au.signOut(auth);
  else await au.signInWithPopup(auth,new au.GoogleAuthProvider());
 }catch(e){
  alert('Не вдалося виконати вхід: '+e.message);
 }
};

function theme(t){
 document.documentElement.dataset.theme=t;
 $('#lg').src=t==='dark'?'logo-white.png':'logo-black.png';
 try{localStorage.setItem('th',t)}catch(e){}
}

$('#th').onclick=()=>{
 theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
};

theme((()=>{
 try{return localStorage.getItem('th')}catch(e){return null}
})()||'dark');

const points=()=>Object.keys(prog).reduce((sum,k)=>
 sum+(/:q\d+$/.test(k)?10:/:p\d+$/.test(k)?5:0),0);

function updatePoints(){
 $('#pt').textContent=user?'⭐ '+points():'';
}

async function saveProgress(key){
 prog[key]=1;
 updatePoints();

 if(user&&LIVE){
  try{
   await fs.setDoc(fs.doc(db,'users',user.uid),{
    progress:prog,
    last:Date.now()
   },{merge:true});
  }catch(e){
   console.error('Помилка збереження прогресу:',e);
  }
 }
}

 app.innerHTML=`
  <div class="hero">
   <img src="banner.jpg" alt="Easyyy_Math — Саша, математичний наставник">
  </div>

  <div class="cta">
   <a class="b" href="#book">Записатися на заняття</a>
   <a class="b o" href="#about">Про мене</a>
  </div>

  <h2>Обирай предмет</h2>
  <div class="grid">
   <a class="big" href="#subj/algebra">
    📐 Алгебра
    <small>Теорія · квізи · практика</small>
   </a>
   <a class="big" href="#subj/geometry">
    🔺 Геометрія
    <small>Теорія · квізи · практика</small>
   </a>
  </div>

  <div class="card">
   <h3>🎓 Навчайся у своєму темпі</h3>
   <p>Обирай клас, вивчай теорію, перевіряй себе в квізах і закріплюй знання на практиці.</p>
   ${user
    ?'<a class="b" href="#account">Перейти до мого кабінету</a>'
    :'<p class="topic-status">Увійди через Google, щоб зберігати власний прогрес.</p>'
   }
  </div>`;
}

function subjectPage(subject,grade){
 const list=topics.filter(t=>t.subject===subject);
 const selected=grade?Number(grade):null;

 app.innerHTML=`
  <h2>${NAMES[subject]||'Предмет'}</h2>
  <p class="topic-status">Обери клас, щоб переглянути теми.</p>
  <div class="tabs">
   ${GRADES.map(g=>`
    <a class="${selected===g?'on':''}" href="#subj/${subject}/${g}">
     ${g} клас
    </a>`).join('')}
  </div>
  <div id="subjectTopics"></div>`;

 if(!selected)return;

 const filtered=list.filter(t=>Number(t.grade)===selected);
 const sections=[...new Set(filtered.map(t=>t.section||'Інші теми'))];
 const target=$('#subjectTopics');

 if(!filtered.length){
  target.innerHTML='<div class="card empty">У цьому класі поки немає доданих тем. Скоро вони з’являться 💛</div>';
  return;
 }

 target.innerHTML=sections.map(section=>`
  <h3>${esc(section)}</h3>
  ${filtered.filter(t=>(t.section||'Інші теми')===section).map(t=>{
   const done=!!prog[t.id+':done'];
   return `
    <a class="card" style="display:block;text-decoration:none" href="#topic/${encodeURIComponent(t.id)}">
     <b>${esc(t.title)}</b><br>
     <small>${done?'✓ Квіз пройдено · ':''}Теорія · Квіз · Практика</small>
    </a>`;
  }).join('')}
 `).join('');
}

function topicPage(id,tab='theory'){
 const t=topics.find(x=>x.id===id);
 if(!t){home();return}

 const tabs=[
  ['theory','Теорія'],
  ['quiz','Квіз'],
  ['practice','Практика']
 ];

 let body='';

 if(tab==='theory'){
  body=`
   <div class="card">
    <p>${rich(t.theory||'')}</p>

    ${(t.images||[]).map(m=>`
     <figure>
      <img src="${esc(m.src)}" alt="${esc(m.cap||'Ілюстрація до теми')}">
      ${m.cap?`<figcaption>${esc(m.cap)}</figcaption>`:''}
     </figure>
    `).join('')}

    ${t.formula?`<div class="f">${formulaMarkup(t.formula)}</div>`:''}
    ${t.tip?`<div class="tip">💡 ${rich(t.tip)}</div>`:''}
    ${t.mistake?`<div class="err">⚠️ ${rich(t.mistake)}</div>`:''}
   </div>

   <a class="b" href="#topic/${encodeURIComponent(id)}/quiz">
    Перевірити себе → квіз
   </a>`;
 }

 if(tab==='quiz'){
  const quiz=t.quiz||[];
  body=quiz.length?quiz.map((q,i)=>`
   <div class="card q" data-i="${i}">
    <b>${i+1}. ${rich(q.q)}</b>
    ${(q.o||[]).map((o,j)=>`
     <button type="button" data-j="${j}">${rich(o)}</button>
    `).join('')}
   </div>
  `).join(''):'<div class="card empty">Квіз ще не додано.</div>';
 }

 if(tab==='practice'){
  const practice=t.practice||[];
  body=practice.length?practice.map((p,i)=>`
   <div class="card">
    <b>${i+1}. ${rich(p.q)}</b>
    <details>
     <summary>Показати відповідь</summary>
     <div class="f">${rich(p.a||'')}</div>
     ${p.explanation?`<p>${rich(p.explanation)}</p>`:''}
    </details>
    <label>
     <input type="checkbox" data-p="${i}"
      ${prog[id+':p'+i]?'checked':''}>
     Розв'язала сама
    </label>
   </div>
  `).join(''):'<div class="card empty">Практику ще не додано.</div>';
 }

 app.innerHTML=`
  <a href="#subj/${t.subject}/${t.grade}">← ${NAMES[t.subject]}, ${t.grade} клас</a>
  <h2>${esc(t.title)}</h2>

  <div class="tabs">
   ${tabs.map(([key,name])=>`
    <a class="${key===tab?'on':''}"
     href="#topic/${encodeURIComponent(id)}/${key}">
     ${name}
    </a>
   `).join('')}
  </div>

  ${body}`;

 if(tab==='quiz')setupQuiz(t,id);
 if(tab==='practice')setupPractice(id);
}

function setupQuiz(t,id){
 const quiz=t.quiz||[];
 const boxes=[...app.querySelectorAll('.q')];
 let right=0;
 let answered=0;
 let finished=false;

 boxes.forEach(box=>{
  const i=Number(box.dataset.i);
  const q=quiz[i];

  box.querySelectorAll('button').forEach(button=>{
   button.onclick=()=>{
    if(button.disabled||finished)return;

    const chosen=Number(button.dataset.j);
    const correct=Number(q.a);

    box.querySelectorAll('button').forEach((b,j)=>{
     b.disabled=true;
     if(j===correct)b.classList.add('ok');
    });

    if(chosen===correct){
     right++;
     saveProgress(id+':q'+i);
    }else{
     button.classList.add('bad');
    }

    answered++;

    if(answered===quiz.length&&!finished){
     finished=true;
     saveProgress(id+':done');

     app.insertAdjacentHTML('beforeend',`
      <div class="card">
       <h3>Результат: ${right} / ${quiz.length}</h3>
       <p>${right===quiz.length
        ?'Чудова робота! Усі відповіді правильні 🎉'
        :'Гарна спроба! Переглянь помилки та повтори тему.'
       }</p>
       ${user
        ?'<small>Результат збережено у твоєму кабінеті.</small>'
        :'<small>Увійди через Google, щоб зберігати прогрес між пристроями.</small>'
       }
      </div>`);
    }
   };
  });
 });
}

function setupPractice(id){
 app.querySelectorAll('[data-p]').forEach(check=>{
  check.onchange=()=>{
   const key=id+':p'+check.dataset.p;
   if(check.checked)saveProgress(key);
  };
 });
}

function accountPage(){
 if(!user){
  app.innerHTML=`
   <h2>👤 Мій кабінет</h2>
   <div class="card">
    <p>Увійди через Google, щоб переглядати власний прогрес і зберігати результати навчання.</p>
    <button class="b" id="accountLogin">Увійти через Google</button>
   </div>`;
  $('#accountLogin').onclick=()=>$('#au').click();
  return;
 }

 const completed=topics.filter(t=>prog[t.id+':done']);
 const quizAnswers=Object.keys(prog).filter(k=>/:q\d+$/.test(k)).length;
 const practiceDone=Object.keys(prog).filter(k=>/:p\d+$/.test(k)).length;
 const totalTopics=topics.length;
 const percent=totalTopics
  ?Math.round(completed.length/totalTopics*100):0;

 app.innerHTML=`
  <h2>👤 Мій кабінет</h2>

  <div class="card">
   <h3>Привіт, ${esc(user.displayName||'учню')}! 💛</h3>
   <p class="topic-status">${esc(user.email||'')}</p>
   <p>Тут зберігається твій особистий навчальний прогрес.</p>
  </div>

  <div class="stat-grid">
   <div class="card stat">
    <strong>${quizAnswers}</strong>
    <span>Правильних відповідей</span>
   </div>
   <div class="card stat">
    <strong>${practiceDone}</strong>
    <span>Виконаних завдань</span>
   </div>
   <div class="card stat">
    <strong>${completed.length}</strong>
    <span>Пройдених квізів</span>
   </div>
  </div>

  <div class="card">
   <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
    <b>Загальний прогрес</b>
    <b>${percent}%</b>
   </div>
   <div class="progress-line">
    <span style="width:${percent}%"></span>
   </div>
   <small>Пройдено тем: ${completed.length} із ${totalTopics}</small>
  </div>

  <h3>📚 Мої результати за темами</h3>
  <div id="myTopics"></div>

  <div class="card">
   <h3>⭐ Мої бали: ${points()}</h3>
   <p class="topic-status">За правильну відповідь у квізі — 10 балів, за виконане практичне завдання — 5 балів.</p>
  </div>
 `;

 const target=$('#myTopics');

 if(!topics.length){
  target.innerHTML='<div class="card empty">Навчальні теми поки не додані.</div>';
  return;
 }

 target.innerHTML=topics.map(t=>{
  const quizCount=(t.quiz||[]).length;
  const practiceCount=(t.practice||[]).length;
  const correct=(t.quiz||[]).filter((q,i)=>!!prog[t.id+':q'+i]).length;
  const practice= (t.practice||[]).filter((p,i)=>!!prog[t.id+':p'+i]).length;
  const done=!!prog[t.id+':done'];

  return `
   <div class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
     <b>${esc(t.title)}</b>
     <span class="topic-status">${done?'✓ Квіз завершено':'У процесі'}</span>
    </div>
    <small>${t.grade} клас · ${NAMES[t.subject]||esc(t.subject)}</small>
    <p class="topic-status">
     Правильних відповідей: ${correct}/${quizCount}<br>
     Практичних завдань: ${practice}/${practiceCount}
    </p>
    <a class="b o" href="#topic/${encodeURIComponent(t.id)}">Перейти до теми</a>
   </div>`;
 }).join('');
}

function aboutPage(){
 const socials=(S.socials||[]).map(s=>`
  <a class="b o" target="_blank" rel="noopener noreferrer"
   href="${esc(safeLink(s.url))}">${esc(s.name)}</a>
 `).join('');

 app.innerHTML=`
  <h2>Про мене</h2>
  <div class="card">
   <p>${rich(S.about||'')}</p>
   <div class="cta">${socials}</div>
  </div>
  <a class="b" href="#book">Записатися на заняття</a>`;
}

function bookPage(){
 const link=safeLink(S.formUrl||'');

 app.innerHTML=`
  <h2>Запис на заняття</h2>
  ${S.formUrl&&link!=='#'
   ?`<iframe src="${esc(link)}" title="Форма запису"></iframe>
     <p><a href="${esc(link)}" target="_blank" rel="noopener">Відкрити форму окремо</a></p>`
   :`<div class="card">
      <p>Форму ще не підключено.</p>
      <p>Напиши мені в Telegram:</p>
      <a class="b" href="https://t.me/easyyy_math" target="_blank" rel="noopener">Перейти в Telegram</a>
     </div>`
  }`;
}

function route(){
 const parts=location.hash.slice(1).split('/');
 const routeName=parts[0]||'home';
 const a=parts[1]?decodeURIComponent(parts[1]):'';
 const b=parts[2]?decodeURIComponent(parts[2]):'';

 $('#nv').classList.remove('open');

 document.querySelectorAll('#nv a').forEach(link=>{
  link.classList.toggle('on',
   link.getAttribute('href')==='#'+routeName);
 });

 const routes={
  home:home,
  subj:()=>subjectPage(a,b),
  topic:()=>topicPage(a,b||'theory'),
  account:accountPage,
  about:aboutPage,
  book:bookPage
 };

 (routes[routeName]||home)();
 window.scrollTo(0,0);
 typesetMath(app);
}

$('#mn').onclick=()=>$('#nv').classList.toggle('open');

addEventListener('hashchange',route);
window.addEventListener('load',()=>typesetMath(app));

route();
</script>
</body>
</html>
