
<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easyyy_Math</title>
<meta name="description" content="Easyyy_Math — математика просто та зрозуміло. Теорія, квізи й практика для 5–11 класів.">

<link rel="apple-touch-icon" href="favicon.png">
<meta property="og:title" content="Easyyy_Math">
<meta property="og:image" content="banner.jpg">

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)'],['$','$']],
    displayMath: [['\\[','\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script','style','textarea','pre','code']
  },
  startup: {typeset:false}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
:root {
  --bg:#06194a;
  --bg2:#0a2670;
  --card:#0e2f86;
  --t:#fff;
  --m:#b9c6ee;
  --y:#ffd23f;
  --r:#ff6b70;
  --g:#3ddc97;
  --bd:#2a4aa8;
}
[data-theme=light] {
  --bg:#f3f6fd;
  --bg2:#fff;
  --card:#fff;
  --t:#0b1f4d;
  --m:#5a6b99;
  --bd:#d5ddf0;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--t);
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  line-height:1.5;
  overflow-x:hidden;
  background-image:
    radial-gradient(circle at 15% -5%,#2358d8 0,transparent 42%),
    radial-gradient(circle at 100% 35%,#0f3aa0 0,transparent 35%);
  background-attachment:fixed;
}
[data-theme=light] body {
  background-image:radial-gradient(circle at 15% -5%,#dbe6ff 0,transparent 45%);
}
a {color:inherit}
button,input {font:inherit}
header {
  position:sticky;
  top:0;
  z-index:5;
  background:var(--bg2);
  border-bottom:1px solid var(--bd);
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 14px;
  flex-wrap:wrap;
}
.brand {
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  text-decoration:none;
  margin-right:5px;
}
.brand img {
  width:38px;
  height:38px;
  object-fit:contain;
}
nav {
  display:flex;
  gap:4px;
  flex:1;
  flex-wrap:wrap;
}
nav a {
  padding:6px 12px;
  border-radius:16px;
  text-decoration:none;
  font-size:14px;
}
nav a:hover,nav a.on {
  background:var(--y);
  color:#0b1f4d;
}
#mn {display:none;order:5}
.b {
  background:var(--y);
  color:#0b1f4d;
  border:0;
  border-radius:12px;
  padding:10px 16px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}
.b.o {
  background:none;
  color:var(--t);
  border:2px solid var(--bd);
}
.b:disabled {
  opacity:.5;
  cursor:not-allowed;
}
main {
  max-width:900px;
  margin:0 auto;
  padding:16px 14px 50px;
}
.hero {
  width:100vw;
  margin:-16px 0 0 calc(50% - 50vw);
}
.hero img {
  width:100%;
  max-height:70vh;
  object-fit:cover;
  object-position:center;
  display:block;
}
.cta {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:14px 0;
}
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.big {
  background:var(--card);
  border:2px solid var(--y);
  border-radius:18px;
  padding:22px;
  text-decoration:none;
  font-size:22px;
  font-weight:800;
  text-align:center;
  box-shadow:0 8px 24px #0005;
  transition:.15s;
}
.big small {
  display:block;
  font-weight:400;
  font-size:13px;
  color:var(--m);
}
.card {
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:14px;
  padding:14px;
  margin:10px 0;
}
.card small {color:var(--m)}
.tabs {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:10px 0;
}
.tabs a,.tabs button {
  padding:7px 14px;
  border-radius:16px;
  border:2px solid var(--bd);
  background:none;
  color:var(--t);
  text-decoration:none;
  font:inherit;
  cursor:pointer;
}
.tabs .on {
  background:var(--y);
  color:#0b1f4d;
  border-color:var(--y);
}
.f {
  background:var(--y);
  color:#0b1f4d;
  padding:10px 14px;
  border-radius:10px;
  font-weight:700;
  margin:8px 0;
  overflow-wrap:anywhere;
}
.tip {
  background:#fff3bd;
  color:#4a3b00;
  border-left:5px solid var(--y);
  padding:10px 12px;
  border-radius:8px;
  margin:8px 0;
}
.err {
  background:#ffe0e1;
  color:#6b0f13;
  border-left:5px solid var(--r);
  padding:10px 12px;
  border-radius:8px;
  margin:8px 0;
}
.q button {
  display:block;
  width:100%;
  text-align:left;
  margin:5px 0;
  padding:10px 12px;
  border:2px solid var(--bd);
  border-radius:10px;
  background:none;
  color:var(--t);
  font:inherit;
  cursor:pointer;
}
.q button.ok {
  background:var(--g);
  color:#032;
  border-color:var(--g);
}
.q button.bad {
  background:var(--r);
  color:#300;
  border-color:var(--r);
}
input {
  width:100%;
  padding:11px;
  border:2px solid var(--bd);
  border-radius:10px;
  background:var(--bg2);
  color:var(--t);
}
input[type=checkbox] {width:auto}
iframe {
  width:100%;
  height:700px;
  border:0;
  border-radius:14px;
  background:#fff;
}
footer {
  text-align:center;
  color:var(--m);
  font-size:13px;
  padding:20px;
}
figure {margin:12px 0}
figure img {
  max-width:100%;
  border-radius:12px;
  background:#fff;
  display:block;
}
figcaption {
  color:var(--m);
  font-size:13px;
  margin-top:4px;
}
.pill {
  background:var(--y);
  color:#0b1f4d;
  border-radius:14px;
  padding:5px 11px;
  font-weight:700;
  font-size:13px;
}
.pill:empty {display:none}
.MathJax {
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
}
.stat-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.stat {text-align:center;padding:15px 8px}
.stat strong {
  display:block;
  color:var(--y);
  font-size:27px;
}
.stat span {font-size:12px;color:var(--m)}
.progress-line {
  height:9px;
  background:var(--bg);
  border-radius:20px;
  overflow:hidden;
  margin:8px 0;
}
.progress-line span {
  display:block;
  height:100%;
  background:var(--y);
  border-radius:20px;
}
.topic-status {font-size:12px;color:var(--m)}
.empty {
  padding:18px;
  text-align:center;
  color:var(--m);
}
a.card:hover,.big:hover {
  transform:translateY(-3px);
  border-color:var(--y);
}

/* МАГАЗИН */
.shop-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.shop-card {
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:18px;
  transition:.2s;
}
.shop-card:hover {
  transform:translateY(-3px);
  border-color:var(--y);
}
.shop-card h3 {margin:0}
.shop-card p {flex:1;color:var(--m)}
.shop-price {
  font-size:23px;
  font-weight:800;
  color:var(--y);
}
.shop-card .b {text-align:center}
.shop-section {margin:25px 0}
.shop-icon {font-size:36px}
.shop-balance {
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.shop-balance strong {
  color:var(--y);
  font-size:26px;
}
.answer-row {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.answer-row input {flex:1;min-width:150px}
.feedback {font-weight:650}
.feedback.good {color:var(--g)}
.feedback.bad {color:var(--r)}

/* АДАПТАЦІЯ ДЛЯ ТЕЛЕФОНІВ */
@media(max-width:700px) {
  header {
    padding:8px 10px;
    gap:7px;
  }
  .brand {
    margin-right:auto;
    font-size:15px;
  }
  .brand img {
    width:34px;
    height:34px;
  }
  #mn {display:inline-block}
  nav {
    display:none;
    flex-direction:column;
    width:100%;
    flex:none;
    order:9;
    gap:2px;
  }
  nav.open {display:flex}
  nav a {
    width:100%;
    padding:12px;
    font-size:16px;
  }
  #au {
    padding:8px 10px;
    font-size:12px;
  }
  main {
    padding:14px 12px 40px;
  }
  .hero {
    margin-top:-14px;
  }
  .hero img {
    width:100%;
    height:auto;
    max-height:none;
    object-fit:contain;
  }
  .grid,.shop-grid {
    grid-template-columns:1fr;
  }
  .card {overflow-wrap:anywhere}
  .stat-grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .cta .b {
    flex:1;
    text-align:center;
  }
}
</style>
</head>

<header>
  <a class="brand" href="#home">
    <img id="lg" src="logo-white.png" alt="">
    Easyyy_Math
  </a>

  <button class="b o" id="mn" aria-label="Меню">☰</button>

  <nav id="nv">
    <a href="#home">Головна</a>

    <a href="#shop">Магазин ⭐</a>

  </nav>

  <span class="pill" id="pt"></span>

<main id="app"></main>

<footer>
  © Easyyy_Math · математику не зубрять — її розуміють

<script type="module">
import {firebaseConfig} from './firebase-config.js';

const LIVE=!!firebaseConfig?.apiKey &&
  !firebaseConfig.apiKey.startsWith('YOUR');

let topics=[
  {
    id:'g1',
    subject:'geometry',
    grade:7,
    section:'Трикутники',
    title:'Сума кутів трикутника',
    theory:'Сума кутів будь-якого трикутника дорівнює 180°.',
    formula:'\\angle A+\\angle B+\\angle C=180^\\circ',
    tip:'Три кути складаються в розгорнутий кут.',
    mistake:'У чотирикутнику сума кутів 360°, а не 180°.',
    quiz:[
      {
        q:'Кути 50° і 60°. Чому дорівнює третій кут?',
        o:['60°','70°','80°'],
        a:1
      }
    ],
    practice:[
      {
        q:'У трикутнику два кути по 45°. Знайди третій.',
        a:'90°',
        explanation:'180° − 45° − 45° = 90°.'
      }
    ]
  },
  {
    id:'a1',
    subject:'algebra',
    grade:7,
    section:'Вирази',
    title:'Формула різниці квадратів',
    theory:'Різниця квадратів розкладається на добуток суми й різниці.',
    formula:'a^2-b^2=(a-b)(a+b)',
    tip:'Квадрат мінус квадрат — дужка на дужку.',
    mistake:'(a − b)² ≠ a² − b².',
    quiz:[
      {
        q:'x² − 9 = ?',
        o:['(x − 3)²','(x − 3)(x + 3)','(x − 9)(x + 1)'],
        a:1
      }
    ],
    practice:[
      {
        q:'Розклади 25 − y².',
        a:'(5 − y)(5 + y)'
      }
    ]
  }
];

let S={
  about:'Привіт! Я Саша — твій матнаставник. Допомагаю зрозуміти математику, а не зубрити її.',
  formUrl:'',
  socials:[
    {name:'Telegram',url:'https://t.me/easyyy_math'}
  ]
};

let shopItems=[];
let materialItems=[];
let user=null;
let prog={};
let db,fs,auth,au;
let authReady=false;

const $=s=>document.querySelector(s);
const app=$('#app');

const NAMES={
  algebra:'Алгебра',
  geometry:'Геометрія'
};

const GRADES=[5,6,7,8,9,10,11];

function esc(s) {
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function safeLink(url) {
  try {
    const u=new URL(url,location.href);
    return ['http:','https:'].includes(u.protocol)?u.href:'#';
  }catch {
    return '#';
  }
}

function rich(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}

function formulaMarkup(value) {
  const source=String(value??'').trim();
  if(!source)return '';
  const content=rich(source);
  const wrapped=/\\\(|\\\[|(^|[^\\])\$/.test(source);
  return wrapped?content:`\\[${content}\\]`;
}

function typesetMath(root=app) {
  const mj=window.MathJax;
  if(!mj?.startup?.promise)return;
  mj.startup.promise.then(()=>{
    if(!root?.isConnected)return;
    mj.typesetClear([root]);
    return mj.typesetPromise([root]);
  }).catch(console.error);
}

/* FIREBASE */
if(LIVE) {
  try {
    const base='https://www.gstatic.com/firebasejs/10.12.2/';

    const [A,Au,F]=await Promise.all([
      import(base+'firebase-app.js'),
      import(base+'firebase-auth.js'),
      import(base+'firebase-firestore.js')
    ]);

    const firebaseApp=A.initializeApp(firebaseConfig);
    auth=Au.getAuth(firebaseApp);
    au=Au;
    db=F.getFirestore(firebaseApp);
    fs=F;

    try {
      const t=await fs.getDocs(fs.collection(db,'topics'));
      if(!t.empty) {
        topics=t.docs.map(d=>({id:d.id,...d.data()}))
          .filter(t=>t.published!==false);
      }

      const s=await fs.getDoc(fs.doc(db,'settings','site'));
      if(s.exists())S={...S,...s.data()};
    }catch(e) {
      console.error('Помилка завантаження тем:',e);
    }

    try {
      const sh=await fs.getDocs(fs.collection(db,'shop'));
      shopItems=sh.docs.map(d=>({id:d.id,...d.data()}));
    }catch(e) {
      console.error('Помилка магазину:',e);
    }

    try {
      const mt=await fs.getDocs(fs.collection(db,'materials'));
      materialItems=mt.docs.map(d=>({id:d.id,...d.data()}));
    }catch(e) {
      console.error('Помилка матеріалів:',e);
    }

    au.onAuthStateChanged(auth,async u=>{
      user=u;
      prog={};

      if(u) {
        try {
          const d=await fs.getDoc(fs.doc(db,'users',u.uid));
          prog=(d.data()||{}).progress||{};

          await fs.setDoc(fs.doc(db,'users',u.uid),{
            name:u.displayName||'Учень',
            email:u.email||'',
            last:Date.now()
          },{merge:true});
        }catch(e) {
          console.error('Помилка прогресу:',e);
        }
      }

      authReady=true;
      updateAuthButton();
      updatePoints();
      route();
    });

  }catch(e) {
    console.error('Помилка Firebase:',e);
    authReady=true;
  }
}else {
  authReady=true;
}

/* АВТОРИЗАЦІЯ */
function updateAuthButton() {
  $('#au').textContent=user
    ?'Вийти ('+(user.displayName||'').split(' ')[0]+')'
    :'Увійти через Google';
}

$('#au').onclick=async()=>{
  if(!LIVE||!auth) {
    alert('Потрібно підключити Firebase.');
    return;
  }

  try {
    if(user) {
      await au.signOut(auth);
    }else {
      await au.signInWithPopup(
        auth,
        new au.GoogleAuthProvider()
      );
    }
  }catch(e) {
    alert('Не вдалося виконати вхід: '+e.message);
  }
};

/* ТЕМИ ОФОРМЛЕННЯ */
function theme(t) {
  document.documentElement.dataset.theme=t;
  $('#lg').src=t==='dark'
    ?'logo-white.png'
    :'logo-black.png';

  try {
    localStorage.setItem('th',t);
  }catch(e) {}
}

$('#th').onclick=()=>{
  theme(
    document.documentElement.dataset.theme==='dark'
      ?'light':'dark'
  );
};

theme((()=>{
  try {
    return localStorage.getItem('th');
  }catch(e) {
    return null;
  }
})()||'dark');

/* ЗІРОЧКИ ТА ПРОГРЕС */
const points=()=>Object.keys(prog).reduce((sum,k)=>
  sum+(/:q\d+$/.test(k)?10:/:p\d+$/.test(k)?5:0),0);

function updatePoints() {
  $('#pt').textContent=user?'⭐ '+points():'';
}

async function saveProgress(key) {
  if(prog[key])return;

  prog[key]=1;
  updatePoints();

  if(user&&LIVE&&db) {
    try {
      await fs.setDoc(fs.doc(db,'users',user.uid),{
        progress:prog,
        last:Date.now()
      },{merge:true});
    }catch(e) {
      console.error('Помилка збереження:',e);
    }
  }
}

/* ГОЛОВНА СТОРІНКА */
function home() {
  app.innerHTML=`
    <div class="hero">
      <img src="banner.jpg"
        alt="Easyyy_Math — Саша, математичний наставник">
    </div>

    <div class="cta">
      <a class="b" href="#book">Записатися на заняття</a>
      <a class="b o" href="#about">Твій наставник</a>
    </div>

    <h2>Обирай предмет</h2>

    <div class="grid">
      <a class="big" href="#subj/algebra">
        📐 Алгебра
        <small>Теорія · квізи · практика</small>
      </a>

      <a class="big" href="#subj/geometry">
        🔺 Геометрія
        <small>Теорія · квізи · практика</small>
      </a>
    </div>

    <div class="card">
      <h3>🎓 Навчайся у своєму темпі</h3>
      <p>
        Обирай клас, вивчай теорію, перевіряй себе
        в квізах і закріплюй знання на практиці.
      </p>

      ${user
        ?'<a class="b" href="#account">Перейти до мого кабінету</a>'
        :'<p class="topic-status">Увійди через Google, щоб зберігати власний прогрес.</p>'
      }
    </div>

    <div class="card">
      <h3>⭐ Заробляй зірочки!</h3>
      <p>
        Навчайся, виконуй завдання та накопичуй зірочки.
        У магазині з'являтимуться гайди, ігри,
        рамки й інші нагороди.
      </p>
      <a class="b" href="#shop">Перейти в магазин</a>
    </div>`;
}

/* СТОРІНКА ПРЕДМЕТА */
function subjectPage(subject,grade) {
  const list=topics.filter(t=>t.subject===subject);
  const selected=grade?Number(grade):null;

  app.innerHTML=`
    <h2>${NAMES[subject]||'Предмет'}</h2>
    <p class="topic-status">Обери клас, щоб переглянути теми.</p>

    <div class="tabs">
      ${GRADES.map(g=>`
        <a class="${selected===g?'on':''}"
           href="#subj/${subject}/${g}">
          ${g} клас
        </a>
      `).join('')}
    </div>

    <div id="subjectTopics"></div>`;

  if(!selected)return;

  const filtered=list.filter(t=>Number(t.grade)===selected);
  const sections=[...new Set(
    filtered.map(t=>t.section||'Інші теми')
  )];

  const target=$('#subjectTopics');

  if(!filtered.length) {
    target.innerHTML=`
      <div class="card empty">
        У цьому класі поки немає доданих тем.
        Скоро вони з'являться 💛
      </div>`;
    return;
  }

  target.innerHTML=sections.map(section=>`
    <h3>${esc(section)}</h3>

    ${filtered.filter(t=>
      (t.section||'Інші теми')===section
    ).map(t=>{
      const done=!!prog[t.id+':done'];

      return `
        <a class="card"
           style="display:block;text-decoration:none"
           href="#topic/${encodeURIComponent(t.id)}">
          <b>${esc(t.title)}</b><br>
          <small>

/* КВІЗИ */
function setupQuiz(t,id) {
  const quiz=t.quiz||[];
  const boxes=[...app.querySelectorAll('.q')];

  let right=0;
  let answered=0;
  let finished=false;

  boxes.forEach(box=>{
    const i=Number(box.dataset.i);
    const q=quiz[i];

    box.querySelectorAll('button').forEach(button=>{
      button.onclick=()=>{
        if(button.disabled||finished)return;

        const chosen=Number(button.dataset.j);
        const correct=Number(q.a??q.correct??0);

        box.querySelectorAll('button').forEach((b,j)=>{
          b.disabled=true;
          if(j===correct)b.classList.add('ok');
        });

        if(chosen===correct) {
          right++;
          saveProgress(id+':q'+i);
        }else {
          button.classList.add('bad');
        }

        answered++;

        if(answered===quiz.length&&!finished) {
          finished=true;
          saveProgress(id+':done');

          app.insertAdjacentHTML('beforeend',`
            <div class="card">
              <h3>Результат: ${right} / ${quiz.length}</h3>

              <p>
                ${right===quiz.length
                  ?'Чудова робота! Усі відповіді правильні 🎉'
                  :'Гарна спроба! Переглянь помилки та повтори тему.'}
              </p>

              ${user
                ?'<small>Прогрес збережено в кабінеті.</small>'
                :'<small>Увійди через Google, щоб зберігати прогрес.</small>'
              }
            </div>`);
        }
      };
    });
  });
}

/* ПЕРЕВІРКА ПРАКТИКИ */
function normalizeAnswer(value) {
  return String(value??'')
    .trim()
    .toLowerCase()
    .replace(/−/g,'-')
    .replace(/,/g,'.')
    .replace(/\s+/g,'')
    .replace(/°$/,'');
}

function checkAnswer(value,expected) {
  const a=normalizeAnswer(value);
  if(!a)return false;

  return String(expected??'').split(';').some(option=>{
    const b=normalizeAnswer(option);

    if(a===b)return true;

    const x=Number(a);
    const y=Number(b);

    return a!==''&&b!==''&&
      Number.isFinite(x)&&Number.isFinite(y)&&
      Math.abs(x-y)<1e-9;
  });
}

function setupPractice(t,id) {
  app.querySelectorAll('[data-check]').forEach(button=>{
    button.onclick=async()=>{
      const i=Number(button.dataset.check);
      const p=t.practice[i];

      const input=app.querySelector(
        `[data-answer="${i}"]`
      );

      const feedback=app.querySelector(
        `[data-feedback="${i}"]`
      );

      const value=input.value.trim();
      const expected=p.a||p.answer||'';

      if(!value) {
        feedback.textContent='Спочатку введи відповідь.';
        return;
      }

      if(!expected) {
        feedback.textContent='Правильну відповідь ще не додано.';
        return;
      }

      if(checkAnswer(value,expected)) {
        feedback.textContent='Правильно! +5 ⭐';
        feedback.className='feedback good';

        input.disabled=true;
        button.disabled=true;
        button.textContent='✓ Виконано';

        if(!prog[id+':p'+i]) {
          await saveProgress(id+':p'+i);
        }
      }else {
        feedback.textContent='Поки неправильно. Спробуй ще раз 💙';
        feedback.className='feedback bad';
      }
    };
  });
}

/* НАВІГАЦІЯ */
function route() {
  const parts=location.hash.slice(1).split('/');
  const routeName=parts[0]||'home';

  const a=parts[1]
    ?decodeURIComponent(parts[1])
    :'';

  const b=parts[2]
    ?decodeURIComponent(parts[2])
    :'';

  $('#nv').classList.remove('open');

  document.querySelectorAll('#nv a').forEach(link=>{
    link.classList.toggle(
      'on',
      link.getAttribute('href')==='#'+routeName
    );
  });

  const routes={
    home:home,
    subj:()=>subjectPage(a,b),
    topic:()=>topicPage(a,b||'theory'),
    account:accountPage,
    shop:shopPage,
    materials:()=>{location.hash='#shop';},
    about:aboutPage,
    book:bookPage
  };

  (routes[routeName]||home)();

  window.scrollTo(0,0);
  typesetMath(app);
}

$('#mn').onclick=()=>{

};

addEventListener('hashchange',route);
window.addEventListener('load',()=>typesetMath(app));

route();
