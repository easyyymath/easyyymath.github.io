<!DOCTYPE html><html lang="uk" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Easyyy_Math — математика просто. Теорія, квізи, практика, зірочки та магазин для 5–11 класів."><title>Easyyy_Math — твій математичний простір</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]'],['$$','$$']]},startup:{typeset:false}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script></head><body><header><nav><a class="brand" href="#home">Easyyy_<span>Math</span></a><div class="links"><a href="#catalog">Теми</a><a href="#materials">Матеріали</a><a href="#shop">Магазин ⭐</a><a href="#account">Мій кабінет</a><a href="#about">Твій наставник</a><a href="#book">Запис</a><button class="btn alt" id="theme">☀️</button><button class="btn" id="authBtn">Увійти</button></div></nav></header><main id="app"></main><footer>Easyyy_Math 💙 · Математику не зубрять — її розуміють</footer><div class="toast" id="toast" hidden></div>
<script type="module">
import {firebaseConfig} from './firebase-config.js';
import {esc,rich,latex,typeset,sub,subName,safeUrl,checkAnswer,progressStats,getEarned,getBalance} from './shared.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,getDocs,getDoc,setDoc,addDoc,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),$=id=>document.getElementById(id),app=$('app');
let topics=[],shop=[],materials=[],settings={about:'Привіт! Я Саша — твій math-наставник 🧠',socials:[{name:'Telegram',url:'https://t.me/easyyy_math'}]},user=null,profile={},progress={},tab='theory',activeTopic=null,sessionAnswers={},attempts={},drafts={},authReady=false;
function msg(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(msg.timer);msg.timer=setTimeout(()=>$('toast').hidden=true,3800)}
function page(s){app.innerHTML=s;typeset(app)}
function blank(t,s){return `<div class="card"><h2>${esc(t)}</h2><p class="muted">${esc(s)}</p><a class="btn" href="#catalog">До тем</a></div>`}
function link(t){return '#topic/'+encodeURIComponent(t.id)}
function currentStars(){return getBalance({...profile,progress})}
function itemCard(x,kind){let price=Number(x.price||0),owned=(profile.inventory||[]).includes(x.id),free=price===0;return `<div class="card"><div style="font-size:32px">${esc(x.emoji||({frame:'🖼️',badge:'🏅',theme:'🎨',material:'📄'}[x.type]||'📄'))}</div><h3>${esc(x.title)}</h3><p>${rich(x.description||'')}</p><p><b>${price} ⭐</b></p>${kind==='shop'?`<button class="btn buy" data-id="${esc(x.id)}" ${owned?'disabled':''}>${owned?'✓ Придбано':free?'Отримати':'Придбати'}</button>`:price===0||owned?`<a class="btn" href="${esc(safeUrl(x.url)||'#')}" target="_blank" rel="noopener noreferrer">Відкрити</a>`:`<p class="small muted">Доступ після придбання (для захищеної видачі потрібен сервер)</p>`}</div>`}
function home(){page(`<div class="hero"><span class="chip">Easyyy_Math · 5–11 класи</span><h1>Математика без зубріння 💙</h1><p>Зрозумілі пояснення, формули, квізи, практика та зірочки за правильні відповіді. Збирай нагороди й прикрашай свій профіль!</p><div class="actions"><a class="btn" href="#catalog">Почати навчання</a><a class="btn alt" href="#about">Твій наставник</a></div></div><div class="grid"><a class="card" href="#catalog"><h2>📚 Теми</h2><p>Алгебра та геометрія за класами</p></a><a class="card" href="#shop"><h2>⭐ Магазин</h2><p>Рамки, значки та інші нагороди</p></a><a class="card" href="#account"><h2>🏆 Мій прогрес</h2><p>Зірочки, досягнення й колекція</p></a></div><h2>Нові теми</h2><div class="grid">${topics.slice(-3).reverse().map(t=>`<a class="card" href="${link(t)}"><span class="chip">${t.grade} клас</span><h3>${esc(t.title)}</h3><p>${esc(t.section||'')}</p></a>`).join('')||'<p>Теми скоро з’являться.</p>'}</div>`)}
function catalog(){page(`<h1>Обери клас 📚</h1><div class="grid">${[5,6,7,8,9,10,11].map(g=>`<a class="card" href="#grade/${g}"><h2>${g} клас</h2><p>${topics.filter(t=>+t.grade===g).length} тем</p></a>`).join('')}</div>`)}
function grade(g){page(`<p><a href="#catalog">← Усі класи</a></p><h1>${g} клас</h1><div class="grid two">${['algebra','geometry'].map(s=>`<a class="card" href="#subject/${g}/${s}"><h2>${subName(s)}</h2><p>${topics.filter(t=>+t.grade===g&&sub(t.subject)===s).length} тем</p></a>`).join('')}</div>`)}
function subject(g,s){let list=topics.filter(t=>+t.grade===g&&sub(t.subject)===s),sections=[...new Set(list.map(t=>t.section||'Інше'))];page(`<p><a href="#grade/${g}">← ${g} клас</a></p><h1>${subName(s)} · ${g} клас</h1>${sections.map(section=>`<h2>${esc(section)}</h2><div class="grid two">${list.filter(t=>(t.section||'Інше')===section).map(t=>`<a class="card" href="${link(t)}"><h3>${esc(t.title)}</h3><p>📖 Теорія · 🧠 Квіз · ✏️ Практика</p></a>`).join('')}</div>`).join('')||blank('Поки немає тем','Матеріали готуються.')}`)}
function topic(id){let t=topics.find(x=>x.id===id);if(!t){page(blank('Тему не знайдено','Спробуй обрати іншу.'));return}if(activeTopic!==id){activeTopic=id;tab='theory';sessionAnswers={};attempts={};drafts={}}let q=t.quiz||[],p=t.practice||[],done=q.filter((_,i)=>progress[id+':q'+i]).length+p.filter((_,i)=>progress[id+':p'+i]).length,total=q.length+p.length;page(`<p><a href="#subject/${t.grade}/${sub(t.subject)}">← ${subName(t.subject)} · ${t.grade} клас</a></p><span class="chip">${esc(t.section||'')}</span><h1>${esc(t.title)}</h1><div class="columns" style="grid-template-columns:minmax(0,1fr) 230px"><div><div class="tabs">${[['theory','📖 Теорія'],['quiz','🧠 Квіз'],['practice','✏️ Практика']].map(([k,v])=>`<button class="tab ${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('')}</div><div id="lesson"></div></div><aside class="card"><h3>Прогрес</h3><div class="metric">${total?Math.round(done/total*100):0}%</div><div class="meter"><div style="width:${total?done/total*100:0}%"></div></div><p>${done} / ${total} завдань</p><p>Баланс: ${currentStars()} ⭐</p>${!user?'<p class="small muted">Увійди, щоб зберігати прогрес.</p>':''}</aside></div>`);app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;topic(id)});lesson(t)}
function lesson(t){let el=$('lesson');if(!el)return;let id=t.id;
if(tab==='theory'){el.innerHTML=`<div class="card"><h2>Теорія</h2><div>${rich(t.theory||'')}</div>${t.formula?`<div class="math">${latex(t.formula)}</div>`:''}${t.tip?`<div class="soft">💡 ${rich(t.tip)}</div>`:''}${t.mistake?`<div class="soft">⚠️ ${rich(t.mistake)}</div>`:''}${(t.images||[]).map(v=>{let url=safeUrl(typeof v==='string'?v:v.url);return url?`<p><img class="lesson-img" src="${esc(url)}" alt="Схема"></p>`:''}).join('')}<button class="btn" id="nextQuiz">Перейти до квізу →</button></div>`;$('nextQuiz').onclick=()=>{tab='quiz';topic(id)}}
if(tab==='quiz'){el.innerHTML=(t.quiz||[]).length?(t.quiz||[]).map((q,i)=>{let key=id+':q'+i,chosen=sessionAnswers[key],solved=!!progress[key],locked=solved||chosen!==undefined;return `<div class="card"><h3>${i+1}. ${rich(q.question||q.q||'')}</h3>${(q.options||[]).map((o,j)=>`<button class="answer ${locked&&j===+q.correct?'correct':''} ${chosen===j&&j!==+q.correct?'wrong':''}" data-q="${i}" data-o="${j}" ${locked?'disabled':''}>${'АБВГ'[j]||j+1}) ${rich(o)}</button>`).join('')}<p class="${solved?'correct':'wrong'}">${solved?'✓ Правильно':chosen!==undefined?'Неправильно. Можеш повторити тему й спробувати знову.':''}</p></div>`}).join(''):blank('Квіз готується','Питання ще не додано.');el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>quizAnswer(t,+b.dataset.q,+b.dataset.o))}
if(tab==='practice'){el.innerHTML=(t.practice||[]).length?(t.practice||[]).map((p,i)=>{let key=id+':p'+i,done=!!progress[key],tries=attempts[key]||0;return `<div class="card"><h3>${i+1}. ${rich(p.task||p.question||'')}</h3><label>Введи відповідь</label><input id="answer${i}" data-input="${i}" value="${esc(drafts[key]||'')}" placeholder="Наприклад: 1/2 або 0,5" ${done?'disabled':''}><div class="actions"><button class="btn" data-check="${i}" ${done?'disabled':''}>${done?'✓ Виконано':'Перевірити · +5 ⭐'}</button>${tries>=2||done?`<button class="btn alt" data-hint="${i}">Пояснення</button>`:''}</div><p id="feedback${i}" class="${done?'correct':'wrong'}">${done?'✓ Правильно!':''}</p><div class="soft" id="solution${i}" hidden><b>Відповідь:</b> ${rich(p.answer||'')}<p>${rich(p.explanation||'')}</p></div></div>`}).join(''):blank('Практика готується','Завдань поки немає.');el.querySelectorAll('[data-input]').forEach(b=>b.oninput=()=>drafts[id+':p'+b.dataset.input]=b.value);el.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>practiceAnswer(t,+b.dataset.check));el.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{$('solution'+b.dataset.hint).hidden=!$('solution'+b.dataset.hint).hidden;typeset(el)})}typeset(el)}
async function recordAttempt(t,type,index,answer,correct){if(!user)return;try{await addDoc(collection(db,'attempts'),{uid:user.uid,topicId:t.id,type,index,question:type==='quiz'?(t.quiz[index].question||t.quiz[index].q||''):(t.practice[index].task||t.practice[index].question||''),answer:String(answer),correct,at:serverTimestamp()})}catch(e){console.error(e);msg('Не вдалося зберегти історію спроб')}}
async function award(key,points){if(progress[key])return;progress[key]=true;if(!user){msg('Правильно! Увійди, щоб зберегти зірочки.');return}try{const ref=doc(db,'users',user.uid);let fresh=await runTransaction(db,async tx=>{let snap=await tx.get(ref),d=snap.data()||{},p=d.progress||{};if(p[key])return d;let earned=getEarned(d);let next={...d,progress:{...p,[key]:true},earnedStars:earned+points,name:user.displayName||'Учень',email:user.email||''};tx.set(ref,next,{merge:true});return next});profile=fresh;progress=fresh.progress||progress}catch(e){console.error(e);msg('Помилка синхронізації зірочок')}}
async function quizAnswer(t,i,j){let key=t.id+':q'+i,q=t.quiz[i];if(sessionAnswers[key]!==undefined||progress[key])return;sessionAnswers[key]=j;let correct=j===Number(q.correct);if(correct)await award(key,10);await recordAttempt(t,'quiz',i,q.options?.[j]||j,correct);topic(t.id)}
async function practiceAnswer(t,i){let p=t.practice[i],key=t.id+':p'+i;if(progress[key])return;let input=$('answer'+i),answer=input?.value.trim();if(!answer){msg('Введи відповідь');return}drafts[key]=answer;let correct=checkAnswer(answer,p.answer);await recordAttempt(t,'practice',i,answer,correct);if(correct){await award(key,5);msg('Правильно! +5 ⭐');topic(t.id)}else{attempts[key]=(attempts[key]||0)+1;let feedback=$('feedback'+i);if(feedback)feedback.textContent='Поки неправильно. Спробуй ще раз 💙';if(attempts[key]>=2)lesson(t)}}
function materialsPage(){page(`<h1>Навчальні матеріали 📄</h1><p class="muted">Шпаргалки, конспекти та корисні файли.</p><div class="grid">${materials.map(m=>itemCard(m,'material')).join('')||'<p>Матеріали ще готуються.</p>'}</div>`)}
function shopPage(){page(`<h1>Магазин зірочок ⭐</h1><p>Твій баланс: <b>${currentStars()} ⭐</b></p><p class="muted">Заробляй зірочки за правильні відповіді та обмінюй на нагороди.</p><div class="grid">${shop.map(s=>itemCard(s,'shop')).join('')||'<p>Товари скоро з’являться.</p>'}</div>`);app.querySelectorAll('.buy').forEach(b=>b.onclick=()=>buy(b.dataset.id))}
async function buy(id){let x=shop.find(s=>s.id===id);if(!x||!user){msg('Увійди через Google, щоб купувати');return}let price=Number(x.price);if(!Number.isInteger(price)||price<0){msg('Некоректна ціна');return}try{let ref=doc(db,'users',user.uid);let fresh=await runTransaction(db,async tx=>{let s=await tx.get(ref),d=s.data()||{},inventory=d.inventory||[];if(inventory.includes(id))throw Error('Уже придбано');if(getBalance(d)<price)throw Error('Недостатньо зірочок');let next={...d,inventory:[...inventory,id],spentStars:Number(d.spentStars||0)+price};tx.set(ref,next,{merge:true});return next});profile=fresh;progress=fresh.progress||progress;msg('Придбано! 🎉');shopPage()}catch(e){msg(e.message||'Не вдалося придбати')}}
async function equip(id){if(!user)return;let x=shop.find(s=>s.id===id);if(!x||!(profile.inventory||[]).includes(id))return;let field=x.type==='frame'?'equippedFrame':x.type==='badge'?'equippedBadge':x.type==='theme'?'equippedTheme':null;if(!field)return;try{await setDoc(doc(db,'users',user.uid),{[field]:id},{merge:true});profile[field]=id;if(field==='equippedTheme')applySkin();msg('Прикрасу встановлено');account()}catch(e){msg('Не вдалося встановити')}}
function applySkin(){let chosen=shop.find(x=>x.id===profile.equippedTheme);document.documentElement.dataset.skin=chosen?.color||''}
function account(){if(!user){page(`<div class="card"><h1>Мій кабінет</h1><p>Увійди через Google, щоб бачити прогрес і зірочки.</p><button id="loginNow" class="btn">Увійти</button></div>`);$('loginNow').onclick=login;return}let stats=progressStats(progress),frame=shop.find(x=>x.id===profile.equippedFrame),badge=shop.find(x=>x.id===profile.equippedBadge),owned=shop.filter(x=>(profile.inventory||[]).includes(x.id));page(`<h1>Мій кабінет 🏆</h1><div class="card"><div class="avatar ${esc(frame?.color||'')}">${esc(badge?.emoji||'🎓')}</div><h2>${esc(user.displayName||'Учень')}</h2><p>${esc(user.email||'')}</p><p>Зірочки: <b>${currentStars()} ⭐</b></p></div><div class="grid"><div class="card"><div class="metric">${stats.quiz}</div>Правильних відповідей у квізах</div><div class="card"><div class="metric">${stats.practice}</div>Виконаних практичних</div><div class="card"><div class="metric">${getEarned({...profile,progress})}</div>Усього зароблено ⭐</div></div><h2>Моя колекція</h2><div class="grid">${owned.map(x=>`<div class="card"><h3>${esc(x.emoji||'🎁')} ${esc(x.title)}</h3><p>${rich(x.description||'')}</p>${x.type==='material'&&safeUrl(x.url)?`<a class="btn" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">Відкрити матеріал</a>`:['frame','badge','theme'].includes(x.type)?`<button class="btn alt equip" data-id="${esc(x.id)}">Встановити</button>`:''}</div>`).join('')||'<p>Ще немає покупок.</p>'}</div><h2>Мої теми</h2><div class="grid two">${topics.filter(t=>Object.keys(progress).some(k=>k.startsWith(t.id+':')&&progress[k])).map(t=>`<a class="card" href="${link(t)}"><h3>${esc(t.title)}</h3><p>${t.grade} клас</p></a>`).join('')||'<p>Почни з першої теми!</p>'}</div>`);app.querySelectorAll('.equip').forEach(b=>b.onclick=()=>equip(b.dataset.id))}
function about(){page(`<h1>Твій наставник 💙</h1><div class="card"><h2>Привіт! Я Саша 👋</h2><p>${rich(settings.about||'')}</p><div class="actions">${(settings.socials||[]).map(s=>safeUrl(s.url)?`<a class="btn alt" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a>`:'').join('')}</div></div>${(settings.cases||[]).length?'<h2>Історії успіху</h2><div class="grid two">'+settings.cases.map(c=>`<div class="card"><h3>${esc(c.title||c.name||'')}</h3><p>${rich(c.description||c.text||'')}</p></div>`).join('')+'</div>':''}${(settings.reviews||[]).length?'<h2>Відгуки</h2><div class="grid two">'+settings.reviews.map(r=>`<div class="card"><p>${rich(r.text||'')}</p><b>${esc(r.name||r.author||'')}</b></div>`).join('')+'</div>':''}<a class="btn" href="#book">Запис на заняття</a>`)}
function book(){page(`<h1>Запис на заняття 💙</h1><div class="card"><p>Заняття з математики для 5–11 класів, підготовка до НМТ.</p><div class="actions">${safeUrl(settings.formUrl)?`<a class="btn" href="${esc(safeUrl(settings.formUrl))}" target="_blank" rel="noopener noreferrer">Заповнити анкету</a>`:''}<a class="btn alt" href="https://t.me/easyyy_math" target="_blank" rel="noopener noreferrer">Telegram</a></div></div>`)}
function route(){let raw=location.hash.slice(1)||'home',parts=raw.split('/'),name=parts[0];if(name==='home')home();else if(name==='catalog')catalog();else if(name==='grade')grade(+parts[1]);else if(name==='subject')subject(+parts[1],parts[2]);else if(name==='topic')topic(decodeURIComponent(parts.slice(1).join('/')));else if(name==='materials')materialsPage();else if(name==='shop')shopPage();else if(name==='account')account();else if(name==='about')about();else if(name==='book')book();else home()}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
async function login(){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code!=='auth/popup-closed-by-user')msg('Помилка входу: '+e.message)}}
$('authBtn').onclick=()=>user?signOut(auth):login();
let theme=localStorage.getItem('easyyy_theme')||'dark';document.documentElement.dataset.theme=theme;$('theme').textContent=theme==='dark'?'☀️':'🌙';$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;localStorage.setItem('easyyy_theme',theme);$('theme').textContent=theme==='dark'?'☀️':'🌙'};
onAuthStateChanged(auth,async u=>{user=u;profile={};progress={};$('authBtn').textContent=u?'Вийти':'Увійти';if(u){try{let ref=doc(db,'users',u.uid),snap=await getDoc(ref);profile=snap.data()||{};progress=profile.progress||{};await setDoc(ref,{name:u.displayName||'Учень',email:u.email||'',last:serverTimestamp()},{merge:true})}catch(e){console.error(e);msg('Не вдалося завантажити профіль')}}authReady=true;applySkin();route()});
async function load(){try{let [a,b,c,d]=await Promise.all([getDocs(collection(db,'topics')),getDocs(collection(db,'shop')),getDocs(collection(db,'materials')),getDoc(doc(db,'settings','site'))]);topics=a.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.published!==false).sort((x,y)=>+x.grade-+y.grade||String(x.section||'').localeCompare(String(y.section||''),'uk'));shop=b.docs.map(x=>({id:x.id,...x.data()}));materials=c.docs.map(x=>({id:x.id,...x.data()}));if(d.exists())settings={...settings,...d.data()};applySkin();route()}catch(e){console.error(e);msg('Не вдалося завантажити дані Firebase');route()}}
load();
</script></body></html>
